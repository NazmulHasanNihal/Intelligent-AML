name: Intelligent-AML CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric
          pip install -r requirements.txt
          pip install pytest pytest-asyncio slowapi structlog ruff

      - name: Lint Codebase with Ruff
        run: |
          ruff check src/ tests/ comparing_models/ --ignore E501,E402,F401,F403,F405 || true

      - name: Run Pytest Test Suite
        env:
          AML_AUTH_ENFORCED: "false"
          LOG_FORMAT: "console"
        run: |
          python -m pytest tests/ --tb=short -q

  frontend-qa:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Production Frontend Assets
        run: npm run build

  container-validation:
    name: Docker & Compose Configuration Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
