name: Intelligent-AML Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Tests, Security Audit & Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install pytest pytest-asyncio slowapi structlog ruff pip-audit

      - name: Lint Codebase with Ruff
        run: |
          ruff check src/ tests/ comparing_models/ --ignore E501,E402,F401,F403,F405 || true

      - name: Run pip-audit Vulnerability Scan
        run: |
          pip-audit --desc || true

      - name: Run Pytest Test Suite
        env:
          AML_AUTH_ENFORCED: "false"
          LOG_FORMAT: "console"
        run: |
          python -m pytest tests/ --tb=short -q

      - name: Verify Headline Reproduction Evaluators
        run: |
          python evals/reproduce_headlines.py --fast

  frontend-qa:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript Codebase
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Regression Tests
        run: npm test

      - name: Run npm audit Dependency Security Scan
        run: npm audit --audit-level=high || true

      - name: Build Next.js 16 Production Assets
        env:
          NEXT_PUBLIC_APP_MODE: demo
        run: npm run build

  e2e-playwright:
    name: Playwright End-to-End Compliance Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Frontend for Production Preview
        env:
          NEXT_PUBLIC_APP_MODE: demo
        run: npm run build

      - name: Run Playwright E2E Suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  lighthouse-ci:
    name: Lighthouse CI Performance & Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Run Lighthouse CI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadHandler: filesystem
          outputDir: ./lighthouse-reports
        continue-on-error: true

  container-validation:
    name: Docker & Compose Configuration Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config -q
