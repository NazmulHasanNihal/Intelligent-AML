[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-aml"
version = "0.1.0"
description = "Neuro-Symbolic Framework for Omni-Channel Financial Fraud Detection via Temporal Graph Networks & Agentic AI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Nazmul Hasan Nihal"},
]
keywords = ["AML", "GNN", "fraud-detection", "graph-neural-network", "federated-learning", "explainable-ai"]

dependencies = [
    "kaggle>=1.6",
    "langchain>=0.2",
    "crewai>=0.51",
    "reportlab>=4.2",
    "streamlit>=1.37",
    "fastapi>=0.112",
    "uvicorn>=0.30",
    "pyvis>=0.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
