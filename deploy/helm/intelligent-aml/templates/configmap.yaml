apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intelligent-aml.fullname" . }}-config
  labels:
    {{- include "intelligent-aml.labels" . | nindent 4 }}
data:
  APP_MODE: {{ .Values.global.appMode | quote }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.kafka.bootstrapServers | quote }}
  KAFKA_TRANSACTION_TOPIC: {{ .Values.kafka.transactionTopic | quote }}
  DUCKDB_PATH: "{{ .Values.backend.persistence.analytics.mountPath }}/analytics.duckdb"
  NEXT_PUBLIC_APP_MODE: {{ .Values.global.appMode | quote }}
  CTR_THRESHOLD_BDT: "1000000"
  DEFAULT_JURISDICTION: "BD_BFIU"
