apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "intelligent-aml.fullname" . }}-backend
  labels:
    {{- include "intelligent-aml.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "intelligent-aml.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "intelligent-aml.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "intelligent-aml.fullname" . }}-config
            - secretRef:
                name: {{ include "intelligent-aml.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.backend.persistence.analytics.enabled }}
            - name: analytics-storage
              mountPath: {{ .Values.backend.persistence.analytics.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.backend.persistence.analytics.enabled }}
        - name: analytics-storage
          persistentVolumeClaim:
            claimName: {{ include "intelligent-aml.fullname" . }}-analytics-pvc
        {{- end }}
