apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intelligent-aml.fullname" . }}-secrets
  labels:
    {{- include "intelligent-aml.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.database.password | default "ChangeMeInProduction_AML2026!" | quote }}
  DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password | default "ChangeMeInProduction_AML2026!" }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  SECRET_HMAC_KEY: "enterprise_sha256_internal_banking_hmac_signing_key_2026"
