[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-aml"
version = "1.0.0"
description = "C-STGB: Conformal Spatio-Temporal GraphBoost for Robust Anti-Money Laundering Detection under Extreme Imbalance and Camouflage Evasion"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Md. Nazmul", email = "lead.research@intelligent-aml.org"},
]
keywords = [
    "anti-money-laundering",
    "spatio-temporal-graph-neural-networks",
    "conformal-prediction",
    "graphsmote",
    "adversarial-camouflage",
    "financial-forensics",
    "federated-learning",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "torch>=2.0",
    "polars>=1.5",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "networkx>=3.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
agents = [
    "langchain>=0.2",
    "crewai>=0.51",
    "reportlab>=4.2",
]
dashboard = [
    "streamlit>=1.37",
    "fastapi>=0.112",
    "uvicorn>=0.30",
    "pyvis>=0.3",
]

[project.scripts]
intelligent-aml = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "comparing_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short -ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
